# ============================================================
# 签名配置（由 GitHub Actions CI 注入，生产勿手动修改此文件）
# ============================================================
android.useAndroidX=true
# 依赖（OpenCV 4.9.0 / FFmpegKit 6.0-2 / Hilt / Compose）均为 AndroidX，无需 Jetifier，关闭以省内存
android.enableJetifier=false
kotlin.code.style=official
# Kotlin 编译器守护进程单独限内存，避免与 Gradle JVM 抢内存导致 OOM
kotlin.daemon.jvmargs=-Xmx2g

# ========== CI 编译优化（GitHub Actions 免费 runner 7GB）==========
# JVM 内存上限：3GB（Gradle 编排用），Kapt/注解处理器单独配堆，避免总内存超 7GB 被 OOM kill
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
# 禁用 Daemon：避免后台进程吃内存
org.gradle.daemon=false
# 禁用并行编译：单线程省内存
org.gradle.parallel=false
# 禁用构建缓存：节省磁盘IO
org.gradle.caching=false

# --- Release Signing (CI only, injected by GitHub Actions) ---
RELEASE_STORE_FILE=
RELEASE_STORE_PASSWORD=
RELEASE_KEY_ALIAS=
RELEASE_KEY_PASSWORD=
