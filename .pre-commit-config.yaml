# ============================================================
# pre-commit hook 配置
# 触发条件：每次 git commit 时自动运行
# 功能：自动修复尾部空白 + 统一 LF 行尾
# ============================================================
# 文件后缀（逗号分隔）
extensions:
  - kt
  - kts
  - xml
  - gradle
  - gradle.kts
  - md
  - yaml
  - yml
  - properties
  - java
