name: Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Download OpenCV Android SDK
        run: |
          echo "Downloading OpenCV 4.9.0 Android SDK..."
          curl -L -o opencv-sdk.zip "https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip"
          unzip -q opencv-sdk.zip
          ls -la OpenCV-android-sdk/sdk/native/libs/

      - name: Setup OpenCV for project
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86
          mkdir -p app/src/main/jniLibs/x86_64
          
          cp OpenCV-android-sdk/sdk/native/libs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          cp OpenCV-android-sdk/sdk/native/libs/armeabi-v7a/*.so app/src/main/jniLibs/armeabi-v7a/
          cp OpenCV-android-sdk/sdk/native/libs/x86/*.so app/src/main/jniLibs/x86/
          cp OpenCV-android-sdk/sdk/native/libs/x86_64/*.so app/src/main/jniLibs/x86_64/
          
          mkdir -p app/src/main/java/org/opencv
          cp -r OpenCV-android-sdk/sdk/java/src/org/opencv/* app/src/main/java/org/opencv/
          
          echo "OpenCV setup complete:"
          ls app/src/main/jniLibs/arm64-v8a/
          ls app/src/main/java/org/opencv/ | head -5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        id: build
        run: |
          BUILD_TYPE=${{ inputs.build_type || 'release' }}
          GRADLE_TASK="assemble${{ inputs.build_type || 'Release' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "=== Release build: signingConfig=null (unsigned), AGP 8.x handles this correctly ==="
            GRADLE_TASK="assembleRelease"
          fi
          echo "=== Listing all Gradle tasks ==="
          ./gradlew tasks --all 2>&1 | grep -E "(assemble|APK|apk)" | head -30
          echo "=== Building $GRADLE_TASK with --rerun-tasks ==="
          ./gradlew $GRADLE_TASK --no-daemon --rerun-tasks --stacktrace 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== Gradle PIPESTATUS: $EXIT_CODE ==="
          echo "=== Full app/build directory ==="
          find app/build -type f 2>&1
          echo "=== APK files ==="
          find . -name "*.apk" -type f 2>&1
          if [ $EXIT_CODE -ne 0 ]; then echo "Build FAILED with code $EXIT_CODE"; exit $EXIT_CODE; fi

      - name: Show build log tail
        if: always()
        run: |
          echo "=== Last 50 lines of build.log ==="
          tail -50 build.log

      - name: List all APK files
        run: |
          echo "=== All .apk files found ==="
          find . -name "*.apk" -type f 2>&1
          echo "=== APK count: $(find . -name '*.apk' -type f | wc -l) ==="

      - name: List outputs directory
        run: |
          echo "=== app/build/outputs contents ==="
          ls -laR app/build/outputs/ 2>&1 || echo "Directory NOT found"

      - name: Upload APK to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_id }}
          name: APK Build #${{ github.run_number }} (${{ github.sha }})
          body: |
            **Build:** #${{ github.run_number }}
            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`
            **Trigger:** ${{ github.event_name }}
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-${{ github.run_id }}
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Capture build error details
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p ci_artifacts
          {
            echo "RUN_ID=${{ github.run_id }}  SHA=${{ github.sha }}  TIME=$(date -u)"
            echo "=== BUILD LOG (tail 400) ==="
            [ -f build.log ] && tail -400 build.log || echo "build.log MISSING"
            echo "=== APK FILES ==="
            find . -name '*.apk' -type f 2>/dev/null | head -50 || echo "no apks"
            echo "=== app/build/outputs ==="
            ls -laR app/build/outputs/ 2>/dev/null | head -100 || echo "no outputs dir"
            echo "=== gradle.properties ==="
            cat gradle.properties 2>/dev/null || echo "none"
            echo "=== signing/buildType grep in app/build.gradle.kts ==="
            grep -n -E "signing|buildType|isMinify" app/build.gradle.kts 2>/dev/null || echo "none"
          } > ci_artifacts/error.log
          echo "error.log bytes: $(wc -c < ci_artifacts/error.log)"
          # Report via GitHub issue (readable through public API without personal token)
          BODY=$(head -c 30000 ci_artifacts/error.log | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
          curl -s -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"[CI ERROR] run ${{ github.run_id }}\",\"body\":${BODY}}"
          echo "issue reported"
          # Also try ci-debug branch as backup
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add -f ci_artifacts/error.log
          git commit --allow-empty -m "ci: build error log run ${{ github.run_id }}"
          git push -f origin HEAD:ci-debug || echo "ci-debug push failed"
          echo "done"
