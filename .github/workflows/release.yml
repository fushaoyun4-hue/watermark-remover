name: Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        id: build
        run: |
          BUILD_TYPE=${{ inputs.build_type || 'release' }}
          GRADLE_TASK="assemble${{ inputs.build_type || 'Release' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "=== Release build: signingConfig=null (unsigned), AGP 8.x handles this correctly ==="
            GRADLE_TASK="assembleRelease"
          fi
          echo "=== Listing all Gradle tasks ==="
          ./gradlew tasks --all 2>&1 | grep -E "(assemble|APK|apk)" | head -30
          echo "=== Building $GRADLE_TASK with --rerun-tasks ==="
          ./gradlew $GRADLE_TASK --no-daemon --rerun-tasks --stacktrace 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== Gradle PIPESTATUS: $EXIT_CODE ==="
          echo "=== Full app/build directory ==="
          find app/build -type f 2>&1
          echo "=== APK files ==="
          find . -name "*.apk" -type f 2>&1
          if [ $EXIT_CODE -ne 0 ]; then echo "Build FAILED with code $EXIT_CODE"; exit $EXIT_CODE; fi

      - name: Show build log tail
        if: always()
        run: |
          echo "=== Last 50 lines of build.log ==="
          tail -50 build.log

      - name: List all APK files
        run: |
          echo "=== All .apk files found ==="
          find . -name "*.apk" -type f 2>&1
          echo "=== APK count: $(find . -name '*.apk' -type f | wc -l) ==="

      - name: List outputs directory
        run: |
          echo "=== app/build/outputs contents ==="
          ls -laR app/build/outputs/ 2>&1 || echo "Directory NOT found"

      - name: Upload APK to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_id }}
          name: APK Build #${{ github.run_number }} (${{ github.sha }})
          body: |
            **Build:** #${{ github.run_number }}
            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`
            **Trigger:** ${{ github.event_name }}
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-${{ github.run_id }}
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Capture build error details
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci_artifacts
          # build.log is from the previous step that already ran (uses tee)
          {
            echo "=== GRADLE BUILD LOG (last 200 lines) ==="
            if [ -f build.log ]; then tail -200 build.log; else echo "build.log NOT FOUND"; fi
            echo ""
            echo "=== APK FILES (find across entire repo) ==="
            find . -name "*.apk" -type f 2>&1 || echo "No APKs"
            echo ""
            echo "=== app/build/outputs directory ==="
            ls -laR app/build/outputs/ 2>&1 || echo "NOT FOUND"
            echo ""
            echo "=== app/build directory (top-level) ==="
            ls -laR app/build/ 2>&1 | head -50 || echo "NOT FOUND"
            echo ""
            echo "=== gradle.properties ==="
            cat gradle.properties 2>&1 || echo "NOT FOUND"
            echo ""
            echo "=== signingConfigs in app/build.gradle.kts ==="
            grep -C 5 "signing" app/build.gradle.kts 2>&1 || echo "NOT FOUND"
            echo ""
            echo "=== buildTypes in app/build.gradle.kts ==="
            grep -C 3 "buildType" app/build.gradle.kts 2>&1 || echo "NOT FOUND"
          } > ci_artifacts/error.log
          echo "Error log size: $(wc -c < ci_artifacts/error.log) bytes"
          echo "First 500 chars:"
          head -c 500 ci_artifacts/error.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add ci_artifacts/error.log
          git commit -m "ci: build error log run ${{ github.run_id }}"
          echo "Committed: $(git log -1 --format='%H %s')"
          git push -f origin HEAD:ci-debug
          echo "Pushed to ci-debug."
