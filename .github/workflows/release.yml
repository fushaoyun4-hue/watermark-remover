# ============================================================
# GitHub Actions Release CI/CD 流水线
#
# 完整流程：编译 → 签名 Release APK → 性能校验 → 上传产物
#
# GitHub Secrets 配置（必须提前在仓库 Settings → Secrets 中配置）：
#   SIGNING_KEY_BASE64     — keystore 文件的 base64 编码字符串
#   SIGNING_STORE_PASSWORD — keystore 密码
#   SIGNING_KEY_ALIAS       — key 别名
#   SIGNING_KEY_PASSWORD   — key 密码
# ============================================================

name: 🚀 Release CI/CD

on:
  workflow_dispatch:  # 手动触发
    inputs:
      build_type:
        description: 'Build Type'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

  push:
    branches:
      - master
    tags:
      - 'v*'  # 打 tag 时自动触发

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  GRADLE_OPTS: '-Xmx3072m -Dorg.gradle.daemon=false -Dkotlin.incremental=true'
  MAX_APK_SIZE_MB: 120

jobs:
  # ══════════════════════════════════════════════════════════
  # Job 1: 编译 + 签名 Release APK
  # ══════════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1.1 Checkout ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1.2 JDK 17 ───────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      # ── 1.3 Android SDK ──────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses 2>/dev/null || true

      # ── 1.4 Gradle Wrapper ───────────────────────────────
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # ── 1.5 Keystore 解密（仅当 Secrets 配置了签名密钥时）─
      - name: Decode signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "[INFO] 签名密钥已检测到，解密 keystore..."
            echo "$SIGNING_KEY_BASE64" | base64 -d > release-keystore.jks
            echo "SIGNING_KEY_FILE=$(pwd)/release-keystore.jks" >> $GITHUB_ENV
            echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "[✓] Keystore 解密完成，启用 Release 签名"
          else
            echo "[WARN] 未检测到签名密钥，使用 Debug 签名（仅用于测试！）"
            echo "[WARN] 正式发布请在仓库 Settings → Secrets 配置签名密钥"
          fi

      # ── 1.6 依赖缓存 ──────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 1.7 依赖预下载 ────────────────────────────────────
      - name: Download dependencies (no build)
        run: ./gradlew dependencies --no-daemon
        continue-on-error: true

      # ── 1.8 构建 Release APK ──────────────────────────────
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-17_jdk/x64-17.0.9+9/hotspot

      # ── 1.9 产物定位 ──────────────────────────────────────
      - name: Locate APK output
        id: apk_info
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          APK_SIZE=$(du -m "$APK_PATH" | cut -f1)
          echo "APK_SIZE_MB=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "APK_NAME=$(basename $APK_PATH)" >> $GITHUB_OUTPUT
          echo "---"
          echo "📦 APK: $APK_PATH"
          echo "📏 大小: ${APK_SIZE}MB"
          echo "📋 SHA256: $(sha256sum $APK_PATH | cut -d' ' -f1)"

      # ── 1.10 性能校验 ─────────────────────────────────────
      - name: Performance validation
        run: |
          APK_PATH="${{ steps.apk_info.outputs.APK_PATH }}"
          MAX_SIZE=${{ env.MAX_APK_SIZE_MB }}
          ACTUAL_SIZE=${{ steps.apk_info.outputs.APK_SIZE_MB }}

          echo "═══ 性能校验报告 ═══"
          echo "APK 名称    : ${{ steps.apk_info.outputs.APK_NAME }}"
          echo "APK 大小    : ${ACTUAL_SIZE}MB / ${MAX_SIZE}MB (限制)"
          echo "签名类型    : ${{ env.SIGNING_KEY_FILE && '✓ Release 签名' || '⚠ Debug/未签名 (测试用)' }}"

          # APK 大小校验
          if [ "$ACTUAL_SIZE" -gt "$MAX_SIZE" ]; then
            echo "❌ APK 大小超限！${ACTUAL_SIZE}MB > ${MAX_SIZE}MB"
            exit 1
          else
            echo "✅ APK 大小: 通过 (${ACTUAL_SIZE}MB)"
          fi

          # Android manifest 完整性检查
          if unzip -l "$APK_PATH" | grep -q "AndroidManifest.xml"; then
            echo "✅ AndroidManifest.xml: 存在"
          else
            echo "❌ AndroidManifest.xml: 缺失！"
            exit 1
          fi

          # DEX 文件检查
          DEX_COUNT=$(unzip -l "$APK_PATH" | grep -c "classes.*\.dex" || echo 0)
          echo "DEX 分包数  : $DEX_COUNT"
          if [ "$DEX_COUNT" -gt 0 ]; then
            echo "✅ DEX 文件: 存在 ($DEX_COUNT 个)"
          else
            echo "❌ DEX 文件: 缺失！"
            exit 1
          fi

          # 资源文件检查
          if unzip -l "$APK_PATH" | grep -q "resources.arsc"; then
            echo "✅ resources.arsc: 存在"
          else
            echo "❌ resources.arsc: 缺失！"
            exit 1
          fi

          echo ""
          echo "═══ 校验结果: 全部通过 ✅ ═══"

      # ── 1.11 上传 APK 产物 ────────────────────────────────
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.sha }}
          path: ${{ steps.apk_info.outputs.APK_PATH }}
          retention-days: 30
          compression-level: 0  # APK 已是压缩格式，不重复压缩

      # ── 1.12 生成下载页面（Release 发布）────────────────
      - name: Create download info
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "# 📲 APK 下载信息" > download-info.md
          echo "" >> download-info.md
          echo "**版本**: ${{ github.ref_name }}" >> download-info.md
          echo "**构建**: ${{ github.sha }}" >> download-info.md
          echo "**APK**: ${{ steps.apk_info.outputs.APK_NAME }}" >> download-info.md
          echo "**大小**: ${{ steps.apk_info.outputs.APK_SIZE_MB }}MB" >> download-info.md
          echo "**SHA256**: \`$(sha256sum ${{ steps.apk_info.outputs.APK_PATH }} | cut -d' ' -f1)\`" >> download-info.md
          echo "" >> download-info.md
          echo "> 此 APK 为 Release 签名版本，可直接安装到真机。" >> download-info.md

      # ── 1.13 发布到 GitHub Release ──────────────────────
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk_info.outputs.APK_PATH }}
          body_path: download-info.md
          draft: true
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════
  # Job 2: PR / 非 master 分支只做 lint 检查（可选）
  # ══════════════════════════════════════════════════════════
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - name: Run lint
        run: ./gradlew lintRelease --no-daemon
        continue-on-error: true
      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
