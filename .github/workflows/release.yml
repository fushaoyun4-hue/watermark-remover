name: Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        id: build
        run: |
          BUILD_TYPE=${{ inputs.build_type || 'release' }}
          echo "=== Building $BUILD_TYPE APK ==="
          ./gradlew assemble${{ inputs.build_type || 'Release' }} --no-daemon --stacktrace 2>&1 | tee build.log
          EXIT_CODE=$?
          echo "=== Gradle exit code: $EXIT_CODE ==="
          echo "=== app/build directory (first 100 lines) ==="
          find app/build -type f 2>&1 | head -100 || echo "app/build is EMPTY or MISSING"
          echo "=== APK count in app/build ==="
          find app/build -name "*.apk" | wc -l
          if [ $EXIT_CODE -ne 0 ]; then echo "Build FAILED"; exit $EXIT_CODE; fi

      - name: Show build log tail
        if: always()
        run: |
          echo "=== Last 50 lines of build.log ==="
          tail -50 build.log

      - name: List all APK files
        run: |
          echo "=== All .apk files found ==="
          find . -name "*.apk" -type f 2>&1
          echo "=== APK count: $(find . -name '*.apk' -type f | wc -l) ==="

      - name: List outputs directory
        run: |
          echo "=== app/build/outputs contents ==="
          ls -laR app/build/outputs/ 2>&1 || echo "Directory NOT found"

      - name: Upload APK to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_id }}
          name: APK Build #${{ github.run_number }} (${{ github.sha }})
          body: |
            **Build:** #${{ github.run_number }}
            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`
            **Trigger:** ${{ github.event_name }}
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_id }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Capture build error details
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci_artifacts
          { [ -f build.log ] && tail -c 40000 build.log || echo "build.log MISSING"; } > ci_artifacts/build_error.log 2>&1 || true
          find . -name "*.apk" -type f >> ci_artifacts/build_error.log 2>&1 || true
          ls -laR app/build/outputs/ >> ci_artifacts/build_error.log 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add ci_artifacts/build_error.log 2>/dev/null || true
          git commit -m "ci: capture build error [skip ci]" 2>&1 | tail -2 || true
          git push origin HEAD:ci-debug --force 2>&1 | tail -2 || true
