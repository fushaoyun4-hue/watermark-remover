name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Download OpenCV Android SDK
        run: |
          echo "Downloading OpenCV 4.9.0 Android SDK..."
          curl -L -o opencv-sdk.zip "https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip"
          unzip -q opencv-sdk.zip
          ls -la OpenCV-android-sdk/sdk/native/libs/

      - name: Setup OpenCV for project
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86
          mkdir -p app/src/main/jniLibs/x86_64
          
          cp OpenCV-android-sdk/sdk/native/libs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          cp OpenCV-android-sdk/sdk/native/libs/armeabi-v7a/*.so app/src/main/jniLibs/armeabi-v7a/
          cp OpenCV-android-sdk/sdk/native/libs/x86/*.so app/src/main/jniLibs/x86/
          cp OpenCV-android-sdk/sdk/native/libs/x86_64/*.so app/src/main/jniLibs/x86_64/
          
          mkdir -p app/src/main/java/org/opencv
          cp -r OpenCV-android-sdk/sdk/java/src/org/opencv/* app/src/main/java/org/opencv/
          
          echo "OpenCV setup complete:"
          ls app/src/main/jniLibs/arm64-v8a/
          ls app/src/main/java/org/opencv/ | head -5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: List Gradle projects
        run: ./gradlew projects --no-daemon 2>&1 | head -30

      - name: Build Debug APK with verbose output
        id: build_step
        run: |
          set -o pipefail
          echo "=== Running: ./gradlew clean assembleDebug --no-daemon --stacktrace ==="
          ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          echo "=== Gradle exit code: ${PIPESTATUS[0]} ==="

      - name: Show build log tail
        run: |
          echo "=== Last 50 lines of build.log ==="
          tail -50 build.log

      - name: Find all APK files
        run: |
          echo "=== Find all .apk files in entire project ==="
          find . -name "*.apk" -type f 2>&1
          echo "=== APK count ==="
          find . -name "*.apk" -type f | wc -l

      - name: List app/build/outputs
        run: ls -laR app/build/outputs/ 2>&1 || echo "app/build/outputs NOT found"

      - name: Capture build log on failure
        if: failure()
        run: |
          mkdir -p ci_artifacts
          cp build.log ci_artifacts/build_log.txt 2>/dev/null || echo "no build.log"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add ci_artifacts/build_log.txt
          git commit -m "ci: build log run ${{ github.run_id }}" || echo "nothing to commit"
          git push -f origin HEAD:ci-debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.sha }}
          name: Debug APK (${{ github.sha }})
          body: "Debug APK built from `${{ github.sha }}`"
          draft: false
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
