.name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

      - name: Dump build log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ -f build.log ]; then
            tail -c 30000 build.log > /tmp/ci_log.txt
          else
            echo "build.log not generated" > /tmp/ci_log.txt
          fi
          jq -n --rawfile log /tmp/ci_log.txt '{body: ("## CI Build Log (tail 30KB)\n\`\`\`\n" + $log + "\n\`\`\`")}' > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d @/tmp/payload.json \
            "https://api.github.com/repos/$REPO/commits/$SHA/comments"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/*.apk
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ========= 本地构建说明 (Codespace 开发模式) =========
#
# 本项目设计为在 GitHub Codespace 中开发构建：
#
# 1. 打开仓库 -> 点击 "Code" -> "Create codespace on master"
# 2. Codespace 预装 Android SDK 和 JDK 17 (2核4GB免费)
# 3. 在终端运行: ./gradlew assembleDebug
# 4. APK 输出到: app/build/outputs/apk/debug/*.apk
#
# 本地电脑只需: git push / git pull (8GB核显无法本地编译)
#
