name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

      - name: Capture build error
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f build.log ]; then
            SZ=$(wc -c < build.log)
            echo "::error::build.log size=${SZ} bytes"
            if [ "$SZ" -eq 0 ]; then
              echo "::error::build.log EMPTY - gradle produced no captured output"
            else
              echo "::error::=== Kotlin errors (e:) ==="
              grep -E "^e:" build.log | head -n 40 | while IFS= read -r line; do echo "::error::$line"; done
              echo "::error::=== What went wrong ==="
              awk '/What went wrong/{f=1} f{print} /\* Try:/{exit}' build.log | tail -n 15 | while IFS= read -r line; do echo "::error::$line"; done
            fi
          else
            echo "::error::build.log MISSING"
          fi
          mkdir -p ci_artifacts
          { [ -f build.log ] && tail -c 30000 build.log || echo "build.log MISSING"; } > ci_artifacts/ci_error.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add ci_artifacts/ci_error.txt 2>/dev/null
          git commit -m "ci: 保存构建错误日志 [skip ci]" 2>&1 | tail -2 || true
          git push origin HEAD:ci-debug --force 2>&1 | tail -2 || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/*.apk
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

