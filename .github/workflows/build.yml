name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build_step
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Capture build error
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci_artifacts
          if [ -s build.log ]; then
            cp build.log ci_artifacts/ci_error.txt
          else
            echo "build.log MISSING or EMPTY at capture time" > ci_artifacts/ci_error.txt
            ./gradlew assembleDebug --no-daemon 2>&1 | tee -a ci_artifacts/ci_error.txt || true
          fi
          # Append build directory contents for diagnosis
          echo "=== Build directory ===" >> ci_artifacts/ci_error.txt
          find app/build -type f 2>&1 | head -50 >> ci_artifacts/ci_error.txt || true
          echo "=== APK debug dir ===" >> ci_artifacts/ci_error.txt
          ls -laR app/build/outputs/apk/debug/ >> ci_artifacts/ci_error.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add ci_artifacts/ci_error.txt 2>/dev/null
          git commit -m "ci: capture build error [skip ci]" 2>&1 | tail -2 || true
          git push origin HEAD:ci-debug --force 2>&1 | tail -2 || true

      - name: List APK output
        run: |
          echo "=== APK output directory ==="
          ls -la app/build/outputs/apk/debug/ 2>&1 || echo "Directory not found"
          echo "=== All APK files in project ==="
          find app/build -name "*.apk" -type f 2>&1 || echo "No APK files found"
          echo "=== APK count ==="
          find app/build -name "*.apk" -type f 2>&1 | wc -l

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/com.watermarkremover-*-debug.apk
          retention-days: 30

      - name: Publish to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.sha }}
          name: Debug APK (${{ github.sha }})
          body: "Debug APK built from `${{ github.sha }}`"
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/debug/com.watermarkremover-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/com.watermarkremover-armeabi-v7a-debug.apk
            app/build/outputs/apk/debug/com.watermarkremover-x86-debug.apk
            app/build/outputs/apk/debug/com.watermarkremover-x86_64-debug.apk
            app/build/outputs/apk/debug/com.watermarkremover-universal-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
