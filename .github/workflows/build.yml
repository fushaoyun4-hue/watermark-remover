name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # OpenCV 由 app/build.gradle.kts 的 org.opencv:opencv:4.9.0 Maven AAR 提供
      # 包含全部 4 ABI 原生库 + Java 类，无需手动下载/复制 SDK

      # ─── AI 模型下载（ONNX，轻量 AI 图像修复）──────────────────────────────
      - name: Download AI ONNX model (MAT)
        id: download-model
        run: |
          mkdir -p app/src/main/assets
          MODEL_FILE="mat_inpainting.onnx"
          if [ -f "app/src/main/assets/$MODEL_FILE" ]; then
            echo "模型已存在: $MODEL_FILE ($(du -h app/src/main/assets/$MODEL_FILE | cut -f1))"
          else
            echo "开始下载 ONNX AI 模型..."
            URLS=(
              "https://github.com/CS-Presence/quantized-models/releases/download/v1.0/mat_inpainting.onnx"
              "https://huggingface.co/nicehero/mat-onnx/resolve/main/mat_inpainting.onnx"
            )
            for url in "${URLS[@]}"; do
              echo "尝试: $url"
              curl -L --retry 3 --retry-delay 5 -o "app/src/main/assets/$MODEL_FILE" \
                -H "User-Agent: watermark-remover/1.0" \
                --connect-timeout 30 --max-time 300 -C - \
                -w "HTTP:%{http_code} SIZE:%{size_download}MB TIME:%{time_total}s" \
                "$url" 2>&1
              SIZE=$(du -m "app/src/main/assets/$MODEL_FILE" 2>/dev/null | cut -f1)
              if [ "$SIZE" -gt 10 ]; then
                echo "下载成功！大小: ${SIZE}MB"
                break
              else
                echo "下载无效（${SIZE}MB），尝试下一个源"
                rm -f "app/src/main/assets/$MODEL_FILE"
              fi
            done
            if [ -f "app/src/main/assets/$MODEL_FILE" ]; then
              echo "✅ ONNX 模型就绪: $(du -h app/src/main/assets/$MODEL_FILE | cut -f1)"
            else
              echo "⚠️ 未找到 ONNX 模型，构建将以 OpenCV Telea 替代，AI 效果不可用"
            fi
          fi
          echo "=== assets/ 目录内容 ==="
          ls -lh app/src/main/assets/ 2>/dev/null || echo "(空目录)"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: List Gradle projects
        run: ./gradlew projects --no-daemon 2>&1 | head -30

      - name: Build Debug APK with verbose output
        id: build_step
        run: |
          set -o pipefail
          echo "=== Running: ./gradlew clean assembleDebug --no-daemon --stacktrace ==="
          ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          echo "=== Gradle exit code: ${PIPESTATUS[0]} ==="

      - name: Show build log tail
        run: |
          echo "=== Last 50 lines of build.log ==="
          tail -50 build.log

      - name: Find all APK files
        run: |
          echo "=== Find all .apk files in entire project ==="
          find . -name "*.apk" -type f 2>&1
          echo "=== APK count ==="
          find . -name "*.apk" -type f | wc -l

      - name: List app/build/outputs
        run: ls -laR app/build/outputs/ 2>&1 || echo "app/build/outputs NOT found"

      - name: Capture build log on failure
        if: failure()
        run: |
          mkdir -p ci_artifacts
          cp build.log ci_artifacts/build_log.txt 2>/dev/null || echo "no build.log"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add ci_artifacts/build_log.txt
          git commit -m "ci: build log run ${{ github.run_id }}" || echo "nothing to commit"
          git push -f origin HEAD:ci-debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.sha }}
          name: Debug APK (${{ github.sha }})
          body: "Debug APK built from `${{ github.sha }}`"
          draft: false
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
