name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: List Gradle projects
        run: ./gradlew projects --no-daemon 2>&1 | head -30

      - name: Build Debug APK with verbose output
        id: build_step
        run: |
          echo "=== Running: ./gradlew clean assembleDebug --no-daemon --stacktrace ==="
          ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          echo "=== Gradle exit code: $? ==="

      - name: Show build log tail
        run: |
          echo "=== Last 50 lines of build.log ==="
          tail -50 build.log

      - name: Find all APK files
        run: |
          echo "=== Find all .apk files in entire project ==="
          find . -name "*.apk" -type f 2>&1
          echo "=== APK count ==="
          find . -name "*.apk" -type f | wc -l

      - name: List app/build/outputs
        run: ls -laR app/build/outputs/ 2>&1 || echo "app/build/outputs NOT found"

      - name: Upload Debug APKs
        if: steps.build_step.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.build_step.conclusion == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.sha }}
          name: Debug APK (${{ github.sha }})
          body: "Debug APK built from `${{ github.sha }}`"
          draft: false
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
