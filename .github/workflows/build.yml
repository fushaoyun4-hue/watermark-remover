.name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

      - name: Save build error log
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci_artifacts
          if [ -f build.log ]; then
            echo "build.log size: $(wc -c < build.log) bytes" > ci_artifacts/ci_error.txt
            tail -c 25000 build.log >> ci_artifacts/ci_error.txt
          else
            echo "build.log MISSING" > ci_artifacts/ci_error.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add ci_artifacts/ci_error.txt
          git commit -m "ci: 保存构建错误日志 [skip ci]" || echo "nothing to commit"
          git push origin master || echo "PUSH_FAILED"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/*.apk
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ========= 本地构建说明 (Codespace 开发模式) =========
#
# 本项目设计为在 GitHub Codespace 中开发构建：
#
# 1. 打开仓库 -> 点击 "Code" -> "Create codespace on master"
# 2. Codespace 预装 Android SDK 和 JDK 17 (2核4GB免费)
# 3. 在终端运行: ./gradlew assembleDebug
# 4. APK 输出到: app/build/outputs/apk/debug/*.apk
#
# 本地电脑只需: git push / git pull (8GB核显无法本地编译)
#
