name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build_step
        run: ./gradlew clean assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Print build log tail
        run: tail -50 build.log

      - name: Capture build error
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci_artifacts
          cp build.log ci_artifacts/ci_error.txt || true
          echo "=== APK debug dir ===" >> ci_artifacts/ci_error.txt
          ls -laR app/build/outputs/apk/debug/ >> ci_artifacts/ci_error.txt 2>&1 || true
          echo "=== All APK files ===" >> ci_artifacts/ci_error.txt
          find app/build -name "*.apk" >> ci_artifacts/ci_error.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add ci_artifacts/ci_error.txt 2>/dev/null || true
          git commit -m "ci: capture build error [skip ci]" 2>&1 | tail -2 || true
          git push origin HEAD:ci-debug --force 2>&1 | tail -2 || true

      - name: Find all APK files
        run: |
          echo "=== All .apk files in app/build ==="
          find app/build -name "*.apk" -type f 2>&1
          echo "=== APK count ==="
          find app/build -name "*.apk" -type f | wc -l

      - name: List APK debug output
        run: |
          echo "=== app/build/outputs/apk/debug/ ==="
          ls -laR app/build/outputs/apk/debug/ 2>&1 || echo "Directory NOT found"

      - name: Upload Debug APKs
        if: steps.build_step.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks-${{ github.run_id }}
          path: app/build/outputs/apk/debug/

      - name: Publish to GitHub Release
        if: steps.build_step.conclusion == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.sha }}
          name: Debug APK (${{ github.sha }})
          body: |
            Built from `${{ github.sha }}`
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
